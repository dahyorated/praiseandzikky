
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praise & Ezekiel | The Union</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fffaf5;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-nav {
            background: rgba(255, 250, 245, 0.8);
            backdrop-filter: blur(10px);
        }
        /* The rising sun on the RSVP confirmation. The disc is clipped at the
           horizon so it emerges rather than slides into view. */
        @keyframes rsvp-sun-rise {
            from { transform: translateY(30px); }
            to   { transform: translateY(0); }
        }
        @keyframes rsvp-rays-in {
            from { opacity: 0; transform: scale(0.6); }
            to   { opacity: 1; transform: scale(1); }
        }
        .rsvp-sun-disc {
            transform-box: view-box;
            animation: rsvp-sun-rise 1.5s cubic-bezier(.22,.9,.3,1) both;
        }
        .rsvp-rays {
            transform-box: view-box;
            transform-origin: 60px 52px;
            animation: rsvp-rays-in 0.5s ease-out 0.35s both;
        }
        /* Depleting ring on the thank you overlay. 125.664 is the circumference
           of the r=20 circle it is drawn on. */
        @keyframes rsvp-countdown-ring {
            from { stroke-dashoffset: 0; }
            to   { stroke-dashoffset: 125.664; }
        }
        .rsvp-countdown-ring {
            stroke-dasharray: 125.664;
            animation: rsvp-countdown-ring 4s linear both;
        }
        @media (prefers-reduced-motion: reduce) {
            .rsvp-sun-disc, .rsvp-rays, .rsvp-countdown-ring { animation: none; }
        }
    </style>
